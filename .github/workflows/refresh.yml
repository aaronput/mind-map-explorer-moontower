# Daily refresh of this mind map from its Substack. Runs on GitHub, so the Mac can be off.
name: Daily refresh
on:
  schedule:
    - cron: "0 10 * * *"        # 06:00 New York (EDT)
  workflow_dispatch:
  push:
    paths: [".github/workflows/refresh.yml"]   # runs once right after install
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Refresh dataset and push
        run: |
          git config user.name  "mindmap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash ./refresh.sh
